<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thumbnail frame: rounded clip + soft vignette mask -->
  <defs>
    <clipPath id="roundFrame">
      <rect x="4" y="4" width="56" height="56" rx="14" />
    </clipPath>
    <mask id="vignette" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#FFFFFF" />
      <rect x="0" y="44" width="64" height="20" fill="#808080" />
    </mask>
  </defs>
  <g clip-path="url(#roundFrame)">
    <rect x="0" y="0" width="64" height="64" fill="#0F766E" />
    <g mask="url(#vignette)">
      <rect x="0" y="32" width="64" height="32" fill="#134E4A" />
      <circle cx="46" cy="18" r="8" fill="#FDE68A" />
      <path d="M0 50 L18 30 L30 42 L40 34 L64 56 L64 64 L0 64 Z" fill="#065F46" />
    </g>
  </g>
</svg>
