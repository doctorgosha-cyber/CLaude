<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal (seeded: keyboard trap)</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;color:#1b1b1b;background:#fff;line-height:1.5}
header{display:flex;gap:16px;align-items:center} nav a{margin-right:12px;color:#0b4f9c}
.btn{display:inline-block;min-width:44px;min-height:44px;padding:10px 16px;background:#0b4f9c;color:#fff;border:0;border-radius:6px;font-size:16px}
.card{border:1px solid #ccc;border-radius:8px;padding:16px;margin:16px 0;max-width:640px}
label{display:block;margin:8px 0 4px} input,select{min-height:44px;font-size:16px;padding:6px;width:100%;max-width:320px;box-sizing:border-box}
.muted{color:#595959} 
</style></head><body>
<header><a href="#main" class="skip">Skip to content</a><h1>Modal (seeded: keyboard trap)</h1><nav aria-label="Primary"><a href="/">Home</a><a href="/reviews/">Reviews</a><a href="/about/">About</a></nav></header>
<main id="main">

<section class="card"><h2>Compare prices</h2><button class="btn" type="button" id="open">Open price modal</button>
<div id="modal" class="card" role="dialog" aria-label="Price list" hidden><p>Model A: $29</p><button class="btn" type="button" id="close">Close</button><a href="/reviews/">All reviews</a></div></section></main><footer class="muted"><p>&copy; 2026 Anatomy of Things. <a href="/privacy/">Privacy</a></p></footer><script>const m=document.getElementById('modal'),c=document.getElementById('close');document.getElementById('open').onclick=()=>{m.hidden=false;c.focus();};
// seeded defect: focus is trapped and Escape/Tab never leave the modal; the close button does nothing.
document.addEventListener('keydown',e=>{if(!m.hidden){e.preventDefault();c.focus();}});c.onclick=()=>{};c.addEventListener('blur',()=>{if(!m.hidden)setTimeout(()=>c.focus(),0);});</script></body></html>
