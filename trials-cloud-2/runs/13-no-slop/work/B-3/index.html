<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anatomy of Things – films about how everyday objects work</title>
  <meta name="description" content="Short explainer films that take everyday objects apart, dubbed into ten languages.">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="hero" data-testid="hero">
      <h1 class="hero__name" id="channel-name">Anatomy of Things</h1>
      <p class="hero__tagline" id="channel-tagline">Short films that take everyday objects apart to show how they actually work.</p>
      <p class="hero__lang">
        <label for="lang-select">Film titles in</label>
        <select id="lang-select" data-testid="lang-select" autocomplete="off"></select>
      </p>
    </header>

    <section class="films" aria-labelledby="films-heading">
      <h2 class="films__heading" id="films-heading">Latest films</h2>
      <ol class="films__list" id="film-list"></ol>
    </section>

    <section class="newsletter" aria-labelledby="newsletter-heading">
      <h2 class="newsletter__heading" id="newsletter-heading">Hear about the next film</h2>
      <p class="newsletter__blurb" id="newsletter-blurb">One email when a new film is out. Nothing else.</p>
      <form class="newsletter__form" id="newsletter-form" data-testid="newsletter-form" novalidate aria-describedby="newsletter-blurb">
        <label class="newsletter__label" for="newsletter-email">Email address</label>
        <div class="newsletter__row">
          <input class="newsletter__input" type="email" id="newsletter-email" name="email" data-testid="newsletter-email"
                 autocomplete="email" inputmode="email" spellcheck="false" aria-describedby="newsletter-status">
          <button class="newsletter__submit" type="submit" id="newsletter-submit" data-testid="newsletter-submit">Subscribe</button>
        </div>
        <p class="newsletter__status" id="newsletter-status" data-testid="newsletter-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
